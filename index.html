<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copa Carnaval 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0C0C;--ink:#F2F2EE;--mute:#8E8E88;--line:#262626;--field:#1A1A1A;--y:#FCEF0B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0C0C;--ink:#F2F2EE;--mute:#8E8E88;--line:#262626;--field:#1A1A1A}}
:root[data-theme="dark"]{--bg:#0C0C0C;--ink:#F2F2EE;--mute:#8E8E88;--line:#262626;--field:#1A1A1A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
.d{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:800;line-height:.88;letter-spacing:-.5px}
.hero{background:#000;color:#F2F2EE;padding:48px 24px 36px}
.in{max-width:1120px;margin:auto}
.hl{display:flex;align-items:center;gap:clamp(16px,4vw,40px)}.hl img{width:clamp(110px,20vw,200px);height:auto;flex:none}
.hero h1{font-size:clamp(84px,22vw,230px);margin:0;color:var(--y)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero p{font-size:clamp(10px,3vw,24px);margin:18px 0 0;color:#8F8F89;white-space:nowrap}
.stats{display:flex;gap:clamp(24px,6vw,72px);margin-top:40px;flex-wrap:wrap}
.stats b{display:block;font-size:clamp(44px,7vw,72px)}
.stats span{color:#7C7C77;font-size:14px}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:44px}
.track i{height:10px;background:#2A2A2A;border-radius:2px}
.track i.on{background:var(--y)}
.lab{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;font-size:12px;color:#7C7C77}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav .in{display:flex;gap:28px;padding:0 24px;overflow-x:auto}
nav button{font:700 15px Manrope,sans-serif;background:none;border:0;color:var(--mute);padding:18px 0 15px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--y)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
main{padding:48px 24px 80px}
h2.d{font-size:clamp(56px,10vw,112px);margin:0}
.sub{color:var(--mute);margin:12px 0 0}
h3.d{font-size:30px;margin:64px 0 22px;font-weight:700}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:44px 36px}
.g h4{font:800 22px "Big Shoulders Display",sans-serif;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:5px 0;border-top:1px solid var(--line);text-align:right;font-weight:500}
th{color:var(--mute);font-size:12px;border-top:0}
td:first-child,th:first-child{text-align:left}
tr.q td:first-child{box-shadow:inset 4px 0 var(--y);padding-left:10px}
tr.q td:last-child,tr.q .nm{font-weight:800}
.nm{width:100%;font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin-left:-6px}
.nm:hover{border-color:var(--line)}
.m{display:grid;grid-template-columns:34px 1fr 44px 44px 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.m .a{text-align:right}.m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dy{color:var(--mute);font-size:12px}
.sc{width:44px;text-align:center;font:700 16px Manrope,sans-serif;border:0;border-radius:6px;padding:7px 0;background:var(--field);color:var(--ink)}
.sc:disabled{opacity:.35}
.br{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:36px;align-items:center}
.col{display:grid;gap:18px}.col>small{color:var(--mute);font-size:13px}
.mt{border-left:4px solid var(--line);padding:2px 0 2px 14px;display:grid;gap:6px;font-weight:600}
.mt .r{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.mt em{font-style:normal;color:var(--mute);font-weight:500}
.win{border-bottom:2px solid var(--y);justify-self:start}
.pen{font-size:12px;color:var(--mute);font-weight:500}
.pen select{font:inherit;background:var(--field);color:var(--ink);border:0;border-radius:6px;padding:3px}
.champ{border-left-color:var(--y)}.champ .d{font-size:56px}
.cal{border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .t{color:var(--mute);font-size:13px;min-width:190px}.row b{margin-left:auto}
.lg{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--field);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--mute);vertical-align:middle;margin-right:8px;flex:none}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 28px}.tr{display:flex;align-items:center;gap:10px}
.up{cursor:pointer;border:0;padding:0;background:none}.up .lg{width:44px;height:44px;font-size:14px;margin:0;outline:1.5px dashed var(--line)}
.fm{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.fm input,.fm select{font:inherit;background:var(--field);color:var(--ink);border:0;border-radius:6px;padding:9px 10px;max-width:100%}
.btn{font:700 14px Manrope,sans-serif;background:var(--y);color:#0C0C0C;border:0;border-radius:6px;padding:9px 16px;cursor:pointer}
.gl{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:center}.gl button{margin-left:auto;background:none;border:0;color:var(--mute);cursor:pointer;font:inherit}
.ro{display:inline-block;background:none!important;text-align:center}.nm.ro{text-align:left;padding:4px 0;margin:0}
.gs{white-space:normal!important;font-size:12px;color:var(--mute);line-height:1.35;padding-bottom:4px}.m .gs.a{text-align:right}
.lk{font:600 12px Manrope,sans-serif;background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;justify-self:start;padding:2px 0}
.reset{margin-top:56px;font:inherit;background:none;border:1.5px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head>

<script>
const CATS=[{id:'ma',n:'Masculino A',g:4},{id:'mb',n:'Masculino B',g:2},{id:'f',n:'Femenino Libre',g:2},{id:'p',n:'Femenino Promocional',g:2}];
const ng=c=>CATS.find(x=>x.id===c).g;
const L='ABCD',PAIRS=[[0,1],[0,2],[1,2]];
const QF=[[[0,0],[1,1]],[[1,0],[0,1]],[[2,0],[3,1]],[[3,0],[2,1]]];
const SF=[['qf0','qf2'],['qf1','qf3']];
const SF2=[[[0,0],[1,1]],[[1,0],[0,1]]];
let S,view='ma';
function fresh(){const o={};CATS.forEach(c=>{o[c.id]={t:Array.from({length:c.g*3},(_,i)=>'Equipo '+L[Math.floor(i/3)]+(i%3+1)),r:{},k:{},l:{},go:[]}});return o}
try{S=JSON.parse(localStorage.getItem('torneo-v1'))}catch(e){}
if(!S)S=fresh();
CATS.forEach(c=>{S[c.id]=S[c.id]||fresh()[c.id];S[c.id].l=S[c.id].l||{};S[c.id].go=S[c.id].go||[]});
function save(){try{localStorage.setItem('torneo-v1',JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const played=r=>!!r&&r[0]!==''&&r[1]!==''&&r[0]!=null&&r[1]!=null;
function stand(c,g){
 const d=S[c],rows=[0,1,2].map(k=>({i:g*3+k,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));let n=0;
 PAIRS.forEach((p,m)=>{const r=d.r[g+'-'+m];if(!played(r))return;n++;
  const a=rows[p[0]],b=rows[p[1]],x=+r[0],y=+r[1];
  a.pj++;b.pj++;a.gf+=x;a.gc+=y;b.gf+=y;b.gc+=x;
  if(x>y){a.pts+=3}else if(x<y){b.pts+=3}else{a.pts++;b.pts++}});
 rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf||d.t[a.i].localeCompare(d.t[b.i]));
 return{rows,done:n===3}}
function slot(c,[g,pos]){const s=stand(c,g);return s.done?{i:s.rows[pos].i,l:null}:{i:null,l:(pos+1)+'º Grupo '+L[g]}}
function parts(c,id){
 if(id[0]==='q'){const m=QF[+id[2]];return[slot(c,m[0]),slot(c,m[1])]}
 if(id[0]==='s'&&ng(c)===2){const m=SF2[+id[2]];return[slot(c,m[0]),slot(c,m[1])]}
 if(id[0]==='s'){return SF[+id[2]].map(x=>({i:win(c,x),l:'Ganador CF'+(+x[2]+1)}))}
 return['sf0','sf1'].map((x,k)=>({i:win(c,x),l:'Ganador SF'+(k+1)}))}
function win(c,id){
 const p=parts(c,id);if(p[0].i==null||p[1].i==null)return null;
 const r=S[c].k[id];if(!played(r))return null;
 if(+r[0]>+r[1])return p[0].i;if(+r[0]<+r[1])return p[1].i;
 const pen=S[c].k[id+'p'];return pen==='0'?p[0].i:pen==='1'?p[1].i:null}
const lg=(c,i)=>{const u=S[c].l[i];return u?'<img class="lg" alt="" src="'+u+'">':'<span class="lg">'+esc((S[c].t[i]||'?').replace(/^Equipo\s*/,'').slice(0,2))+'</span>'};
const tn=(c,p)=>p.i!=null?lg(c,p.i)+esc(S[c].t[p.i]):'<em>'+p.l+'</em>';
const gs=(c,key,t)=>S[c].go.filter(x=>x.m===key&&x.t===t).sort((x,y)=>(+x.min||0)-(+y.min||0)).map(x=>esc(x.p)+(x.min?' '+esc(x.min)+'’':'')).join(', ');
function gsRow(c,key,a,b){
 const A=gs(c,key,a),B=gs(c,key,b);let h='';
 if(A||B)h+='<span class="gs a" style="grid-column:2">'+A+'</span><span class="gs" style="grid-column:5">'+B+'</span>';
 if(isAdm())h+='<button class="lk" data-gl="'+key+'" style="grid-column:2/-1">+ Cargar goleadores</button>';
 return h}
function groupBlock(c,g){
 const d=S[c],st=stand(c,g);
 let h='<div class="g"><h4>Grupo '+L[g]+'</h4><table><tr><th>Equipo</th><th>PJ</th><th>DG</th><th>Pts</th></tr>';
 st.rows.forEach((r,k)=>{const dg=r.gf-r.gc;h+='<tr'+(k<2&&st.done?' class="q"':'')+'><td><span style="display:flex;align-items:center">'+lg(c,r.i)+'<input class="nm" data-n="'+r.i+'" value="'+esc(d.t[r.i])+'" aria-label="Nombre del equipo"></span></td><td>'+r.pj+'</td><td>'+(dg>0?'+':'')+dg+'</td><td><b>'+r.pts+'</b></td></tr>'});
 h+='</table><div style="margin-top:12px">';
 PAIRS.forEach((p,m)=>{const r=d.r[g+'-'+m]||['',''];
  h+='<div class="m"><span class="dy">Día '+(m+1)+'</span><span class="a">'+lg(c,g*3+p[0])+esc(d.t[g*3+p[0]])+'</span>'+
  '<input class="sc" type="number" min="0" inputmode="numeric" aria-label="Goles local" value="'+r[0]+'" data-r="'+g+'-'+m+'" data-s="0">'+
  '<input class="sc" type="number" min="0" inputmode="numeric" aria-label="Goles visitante" value="'+r[1]+'" data-r="'+g+'-'+m+'" data-s="1">'+
  '<span>'+lg(c,g*3+p[1])+esc(d.t[g*3+p[1]])+'</span>'+gsRow(c,g+'-'+m,g*3+p[0],g*3+p[1])+'</div>'});
 return h+'</div></div>'}
function koMatch(c,id,title,big){
 const p=parts(c,id),r=S[c].k[id]||['',''],w=win(c,id),ok=p[0].i!=null&&p[1].i!=null;
 const row=(k)=>'<div class="r"><span class="'+(w!=null&&w===p[k].i?'win':'')+'">'+tn(c,p[k])+'</span><input class="sc" type="number" min="0" inputmode="numeric" '+(ok?'':'disabled')+' aria-label="Goles" value="'+r[k]+'" data-k="'+id+'" data-s="'+k+'"></div>'+(ok&&gs(c,id,p[k].i)?'<div class="gs">'+gs(c,id,p[k].i)+'</div>':'');
 let h='<div class="mt'+(big?' champ':'')+'">'+(big?'<div class="d">Final</div>':'')+row(0)+row(1)+(ok&&isAdm()?'<button class="lk" data-gl="'+id+'">+ Cargar goleadores</button>':'');
 if(ok&&played(r)&&+r[0]===+r[1]){const pv=S[c].k[id+'p'];
  h+='<div class="pen">Penales, gana: <select data-p="'+id+'"><option value="">Elegir</option><option value="0"'+(pv==='0'?' selected':'')+'>'+esc(S[c].t[p[0].i])+'</option><option value="1"'+(pv==='1'?' selected':'')+'>'+esc(S[c].t[p[1].i])+'</option></select></div>'}
 return h+'</div>'}
function catView(c){
 const n=ng(c),cat=CATS.find(x=>x.id===c);
 let h='<h2 class="d">'+cat.n+'</h2><p class="sub">'+(c==='f'?'Fútbol 6 femenino libre':c==='p'?'Fútbol 6 femenino promocional':'Fútbol 11 masculino')+'. '+n+' grupos de 3 equipos. Clasifican los dos primeros.</p><h3 class="d">Fase de grupos</h3><div class="groups">';
 for(let g=0;g<n;g++)h+=groupBlock(c,g);
 h+='</div><h3 class="d">Fase final</h3><div class="br">';
 if(n===4){h+='<div class="col"><small>Cuartos de final, día 4</small>';for(let i=0;i<4;i++)h+=koMatch(c,'qf'+i);h+='</div>'}
 h+='<div class="col"><small>Semifinales, día 5</small>'+koMatch(c,'sf0')+koMatch(c,'sf1')+'</div>';
 h+='<div class="col"><small>Final, día 6</small>'+koMatch(c,'fin','',true);
 const ch=win(c,'fin');if(ch!=null)h+='<div class="mt champ"><div class="d">Campeón</div><b style="font-size:22px">'+esc(S[c].t[ch])+'</b></div>';
 h+='</div></div>'+scorersView(c);return h}
function calView(){
 const days=[[],[],[],[],[],[]],nm=['Fase de grupos, fecha 1','Fase de grupos, fecha 2','Fase de grupos, fecha 3','Cuartos de final','Semifinales','Finales'];
 CATS.forEach(cat=>{const c=cat.id,d=S[c];
  for(let g=0;g<cat.g;g++)PAIRS.forEach((p,m)=>{const r=d.r[g+'-'+m];days[m].push({cat:cat.n,tag:'Grupo '+L[g],a:esc(d.t[g*3+p[0]]),b:esc(d.t[g*3+p[1]]),sc:played(r)?r[0]+' - '+r[1]:''})});
  const add=(day,id,tag)=>{const p=parts(c,id),r=d.k[id];days[day].push({cat:cat.n,tag,a:tn(c,p[0]),b:tn(c,p[1]),sc:played(r)?r[0]+' - '+r[1]:''})};
  if(cat.g===4)for(let i=0;i<4;i++)add(3,'qf'+i,'CF'+(i+1));
  add(4,'sf0','SF1');add(4,'sf1','SF2');add(5,'fin','Final')});
 let h='<h2 class="d">Calendario</h2><p class="sub">Cada grupo juega un partido por día y un equipo descansa.</p>';
 days.forEach((x,i)=>{h+='<h3 class="d">Día '+(i+1)+' <span style="font-size:20px;color:var(--mute);font-weight:600">'+nm[i]+'</span></h3><div class="cal">';
  x.forEach(m=>h+='<div class="row"><span class="t">'+m.cat+', '+m.tag+'</span><span>'+m.a+' <span style="color:var(--mute)">vs</span> '+m.b+'</span><b>'+m.sc+'</b></div>');
  h+='</div>'});
 return h}
function stageDone(i){
 if(i<3)return CATS.every(c=>{for(let g=0;g<c.g;g++)if(!played(S[c.id].r[g+'-'+i]))return false;return true});
 const ids=i===3?['qf0','qf1','qf2','qf3']:i===4?['sf0','sf1']:['fin'];
 return CATS.every(c=>(i===3&&c.g===2)||ids.every(id=>win(c.id,id)!=null))}
let pc='ma',pm='',upIdx=0;
function matchList(c){
 const o=[];
 for(let g=0;g<ng(c);g++)PAIRS.forEach((p,m)=>o.push({key:g+'-'+m,label:'Grupo '+L[g]+', día '+(m+1),a:g*3+p[0],b:g*3+p[1]}));
 (ng(c)===4?['qf0','qf1','qf2','qf3']:[]).concat(['sf0','sf1','fin']).forEach(id=>{const p=parts(c,id);if(p[0].i!=null&&p[1].i!=null)o.push({key:id,label:id==='fin'?'Final':id[0]==='q'?'Cuartos '+(+id[2]+1):'Semifinal '+(+id[2]+1),a:p[0].i,b:p[1].i})});
 return o}
function setScore(c,m){
 const x=S[c].go.filter(g=>g.m===m.key),grp=m.key.includes('-'),box=grp?S[c].r:S[c].k;
 if(!x.length){delete box[m.key];return}
 box[m.key]=[x.filter(g=>g.t===m.a).length,x.filter(g=>g.t===m.b).length]}
function scorers(c){
 const o={};S[c].go.forEach(g=>{const k=g.t+'|'+g.p.trim().toLowerCase();(o[k]=o[k]||{p:g.p.trim(),t:g.t,n:0}).n++});
 return Object.values(o).sort((a,b)=>b.n-a.n||a.p.localeCompare(b.p))}
function scorersView(c){
 const s=scorers(c).slice(0,8);if(!s.length)return '';
 let h='<h3 class="d">Goleadores</h3><div class="cal">';
 s.forEach((x,i)=>h+='<div class="row"><b style="margin:0;min-width:24px">'+(i+1)+'</b><span>'+esc(x.p)+'</span><span class="t">'+lg(c,x.t)+esc(S[c].t[x.t])+'</span><b>'+x.n+'</b></div>');
 return h+'</div>'}
function panelView(){
 const c=pc,ms=matchList(c);
 if(!ms.find(x=>x.key===pm))pm=ms[0].key;
 const m=ms.find(x=>x.key===pm),T=S[c].t,gl=S[c].go.map((g,i)=>({...g,i})).filter(g=>g.m===pm);
 const r=m.key.includes('-')?S[c].r[m.key]:S[c].k[m.key];
 let h='<h2 class="d">Panel</h2><p class="sub">Equipos, logos y goles de cada categoría.</p><div class="fm" style="margin-top:22px"><select data-pc aria-label="Categoría">'+CATS.map(x=>'<option value="'+x.id+'"'+(x.id===c?' selected':'')+'>'+x.n+'</option>').join('')+'</select></div>';
 h+='<h3 class="d">Equipos y logos</h3><input type="file" id="fi" accept="image/*" hidden><div class="tl">';
 T.forEach((n,i)=>h+='<div class="tr"><button class="up" data-up="'+i+'" aria-label="Subir logo">'+lg(c,i)+'</button><input class="nm" data-n="'+i+'" value="'+esc(n)+'" aria-label="Nombre del equipo"></div>');
 h+='</div><p class="sub">Tocá el círculo para subir el logo. Se achica solo.</p>';
 h+='<h3 class="d">Goles</h3><div class="fm"><select data-pm aria-label="Partido">'+ms.map(x=>'<option value="'+x.key+'"'+(x.key===pm?' selected':'')+'>'+x.label+': '+esc(T[x.a])+' vs '+esc(T[x.b])+'</option>').join('')+'</select></div>';
 h+='<p style="font-size:20px;font-weight:700;margin:0">'+lg(c,m.a)+esc(T[m.a])+' '+(played(r)?r[0]+' - '+r[1]:'vs')+' '+lg(c,m.b)+esc(T[m.b])+'</p>';
 h+='<div class="fm"><select id="gt" aria-label="Equipo"><option value="'+m.a+'">'+esc(T[m.a])+'</option><option value="'+m.b+'">'+esc(T[m.b])+'</option></select><input id="gp" placeholder="Jugador" aria-label="Jugador"><input id="gm" type="number" min="1" placeholder="Min" style="width:80px" aria-label="Minuto"><button class="btn" data-add>Agregar gol</button></div>';
 gl.forEach(g=>h+='<div class="gl"><span class="dy" style="min-width:32px">'+(g.min?g.min+'’':'')+'</span><span>'+esc(g.p)+'</span><span class="dy">'+esc(T[g.t])+'</span><button data-del="'+g.i+'">Quitar</button></div>');
 return h+'<p class="sub">El resultado del partido se calcula con los goles cargados.</p>'}
function logoUp(f,c){
 if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const z=96,cv=document.createElement('canvas');cv.width=cv.height=z;const s=Math.min(im.width,im.height);cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);S[c].l[upIdx]=cv.toDataURL('image/png');save();render()};im.src=fr.result};
 fr.readAsDataURL(f)}
function isAdm(){return location.pathname.replace(/\/+$/,'')==='/admin'||location.hash==='#admin'}
function ro(){
 const a=document.getElementById('app'),sw=(i,cl,t)=>{const x=document.createElement('span');x.className=cl;x.textContent=t;i.replaceWith(x)};
 a.querySelectorAll('input.sc').forEach(i=>sw(i,'sc ro',i.value===''?'–':i.value));
 a.querySelectorAll('input.nm').forEach(i=>sw(i,'nm ro',i.value));
 a.querySelectorAll('select').forEach(i=>sw(i,'',i.options[i.selectedIndex].text))}
function render(){
 if(view==='panel'&&!isAdm())view='ma';
 document.getElementById('track').innerHTML=[0,1,2,3,4,5].map(i=>'<i'+(stageDone(i)?' class="on"':'')+'></i>').join('');
 document.getElementById('tabs').innerHTML=CATS.concat([{id:'cal',n:'Calendario'}],isAdm()?[{id:'panel',n:'Panel'}]:[]).map(c=>'<button role="tab" aria-selected="'+(view===c.id)+'" data-v="'+c.id+'">'+c.n+'</button>').join('');
 document.getElementById('app').innerHTML=(view==='cal'?calView():view==='panel'?panelView():catView(view))+(isAdm()?'<button class="reset">Borrar todos los datos</button>':'');
 document.getElementById('adm').hidden=!isAdm();if(!isAdm())ro()}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-v]');if(b){view=b.dataset.v;render();scrollTo(0,0)}
 const gl=e.target.closest('[data-gl]');if(gl){pc=view;pm=gl.dataset.gl;view='panel';render();scrollTo(0,0)}
 const u=e.target.closest('[data-up]');if(u){upIdx=+u.dataset.up;document.getElementById('fi').click()}
 if(e.target.dataset.add!==undefined){const p=document.getElementById('gp').value.trim();if(p){S[pc].go.push({m:pm,t:+document.getElementById('gt').value,p,min:document.getElementById('gm').value});setScore(pc,matchList(pc).find(x=>x.key===pm));save();render()}}
 const dl=e.target.closest('[data-del]');if(dl){S[pc].go.splice(+dl.dataset.del,1);setScore(pc,matchList(pc).find(x=>x.key===pm));save();render()}
 if(e.target.classList.contains('reset')&&confirm('¿Borrar todos los equipos y resultados?')){S=fresh();save();render()}});
document.addEventListener('change',e=>{
 const t=e.target,c=(view==='panel'?pc:view);
 if(t.id==='fi'){logoUp(t.files[0],c);return}
 if(t.dataset.pc!==undefined){pc=t.value;pm='';render();return}
 if(t.dataset.pm!==undefined){pm=t.value;render();return}
 if(t.dataset.r!==undefined){const r=S[c].r[t.dataset.r]||['',''];r[+t.dataset.s]=t.value;S[c].r[t.dataset.r]=r}
 else if(t.dataset.k!==undefined){const r=S[c].k[t.dataset.k]||['',''];r[+t.dataset.s]=t.value;S[c].k[t.dataset.k]=r}
 else if(t.dataset.p!==undefined)S[c].k[t.dataset.p+'p']=t.value;
 else if(t.dataset.n!==undefined)S[c].t[+t.dataset.n]=t.value.trim()||'Equipo '+(+t.dataset.n+1);
 else return;
 save();render()});
addEventListener('hashchange',render);
document.head.insertAdjacentHTML('beforeend','<link rel="icon" href="'+document.getElementById('logo').src+'">');
render();
</script>
</body>
</html>
